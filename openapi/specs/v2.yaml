openapi: 3.0.3
info:
  title: MITx Online API
  version: 0.0.1 (v2)
  description: MIT public API
paths:
  /api/v2/course_certificates/{uuid}/:
    get:
      operationId: course_certificates_retrieve
      description: Viewset to read a single course certificate
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - course_certificates
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2CourseRunCertificate'
          description: ''
  /api/v2/courses/:
    get:
      operationId: api_v2_courses_list
      description: List all courses - API v2
      parameters:
      - in: query
        name: contract_id
        schema:
          type: number
        description: Only show courses belonging to this B2B contract
      - in: query
        name: courserun_is_enrollable
        schema:
          type: boolean
        description: Course Run Is Enrollable
      - in: query
        name: courseruns__language
        schema:
          type: string
          enum:
          - af_ZA
          - ar
          - az
          - bo
          - da
          - de
          - de_DE
          - el
          - en
          - es_419
          - es_ES
          - fa
          - fr
          - fr_CA
          - he
          - hi
          - hu
          - id
          - it_IT
          - ja
          - ka
          - kk
          - ko
          - lv
          - nl
          - pl
          - pt_BR
          - pt_PT
          - ro
          - ru
          - sq
          - sv
          - sw
          - te
          - th
          - tr_TR
          - uk
          - uz
          - vi
          - zh_CN
          - zh_HANS
          - zh_HK
        description: |-
          ISO 639-1 language code for this run (e.g. 'en', 'zh', 'fr'). Leave blank for unspecified.

          * `af_ZA` - af_ZA
          * `ar` - ar
          * `az` - az
          * `bo` - bo
          * `da` - da
          * `de` - de
          * `de_DE` - de_DE
          * `el` - el
          * `es_419` - es_419
          * `es_ES` - es_ES
          * `en` - en
          * `fa` - fa
          * `fr` - fr
          * `fr_CA` - fr_CA
          * `he` - he
          * `hi` - hi
          * `hu` - hu
          * `id` - id
          * `it_IT` - it_IT
          * `ja` - ja
          * `ka` - ka
          * `kk` - kk
          * `ko` - ko
          * `lv` - lv
          * `nl` - nl
          * `pl` - pl
          * `pt_BR` - pt_BR
          * `pt_PT` - pt_PT
          * `ro` - ro
          * `ru` - ru
          * `sq` - sq
          * `sv` - sv
          * `sw` - sw
          * `te` - te
          * `th` - th
          * `tr_TR` - tr_TR
          * `uk` - uk
          * `uz` - uz
          * `vi` - vi
          * `zh_CN` - zh_CN
          * `zh_HANS` - zh_HANS
          * `zh_HK` - zh_HK
      - in: query
        name: courseruns__variant_industry
        schema:
          type: string
          enum:
          - ''
          - E
          - F
          - HC
        description: |-
          Variant: Describes the industry the run is adapted for.

          * `` - Original
          * `E` - Energy
          * `F` - Finance
          * `HC` - Healthcare
      - in: query
        name: courseruns__variant_length
        schema:
          type: string
          enum:
          - ''
          - S
        description: |-
          Variant: Describes the length of the run (short/long).

          * `` - Full
          * `S` - Short
      - in: query
        name: id
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: include_approved_financial_aid
        schema:
          type: boolean
        description: Include approved financial assistance information
      - in: query
        name: live
        schema:
          type: boolean
      - in: query
        name: org_id
        schema:
          type: number
        description: Only show courses belonging to this B2B/UAI organization
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: page__live
        schema:
          type: boolean
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: readable_id
        schema:
          type: string
      tags:
      - courses
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseWithCourseRunsSerializerV2List'
          description: ''
  /api/v2/courses/{id}/:
    get:
      operationId: api_v2_courses_retrieve
      description: Retrieve a specific course - API v2
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique integer value (pk) or readable_id string identifying
          this course.
        required: true
      tags:
      - courses
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseWithCourseRunsSerializerV2'
          description: ''
  /api/v2/departments/:
    get:
      operationId: departments_list_v2
      description: List departments - v2
      tags:
      - departments
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentWithCoursesAndPrograms'
          description: ''
  /api/v2/departments/{id}/:
    get:
      operationId: departments_retrieve_v2
      description: Get department details - v2
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this department.
        required: true
      tags:
      - departments
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentWithCoursesAndPrograms'
          description: ''
  /api/v2/enrollments/:
    get:
      operationId: user_enrollments_list_v2
      description: List user enrollments with B2B organization and contract information
        - API v2. Use ?exclude_b2b=true to filter out enrollments linked to course
        runs with B2B contracts. Use ?org_id=<id> to filter enrollments by specific
        B2B organization.
      parameters:
      - in: query
        name: exclude_b2b
        schema:
          type: boolean
        description: Exclude B2B enrollments (enrollments linked to course runs with
          B2B contracts)
      - in: query
        name: org_id
        schema:
          type: number
        description: Filter by B2B organization ID
      tags:
      - enrollments
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseRunEnrollmentRequestV2'
          description: ''
    post:
      operationId: user_enrollments_create_v2
      description: Create a new user enrollment - API v2
      tags:
      - enrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRunEnrollmentRequestV2Request'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseRunEnrollmentRequestV2Request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseRunEnrollmentRequestV2Request'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRunEnrollmentRequestV2'
          description: ''
  /api/v2/enrollments/{id}/:
    delete:
      operationId: user_enrollments_destroy_v2
      description: Unenroll from a course - API v2
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course run enrollment.
        required: true
      tags:
      - enrollments
      responses:
        '204':
          description: No response body
  /api/v2/pages/:
    get:
      operationId: pages_list
      description: Returns pages of all types
      summary: List all Wagtail Pages
      parameters:
      - in: query
        name: fields
        schema:
          type: string
        description: Specify fields (e.g. `*`)
      - in: query
        name: type
        schema:
          type: string
        description: Filter by Wagtail page type
      tags:
      - pages
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageList'
          description: ''
  /api/v2/pages/{id}/:
    get:
      operationId: pages_retrieve
      description: Returns details of a specific Wagtail page by ID
      summary: Get Wagtail Page Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the Wagtail page
        required: true
      - in: query
        name: revision_id
        schema:
          type: integer
        description: Optional certificate revision ID to retrieve a specific revision
          of the certificate page
      tags:
      - pages
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDetail'
          description: ''
  /api/v2/pages/?fields=*&type=cms.certificatepage:
    get:
      operationId: pages_?fields=*&type=cms.certificatepage_retrieve
      description: Returns pages of type cms.CertificatePage
      summary: List all Certificate Pages
      tags:
      - pages
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificatePageList'
          description: ''
  /api/v2/pages/?fields=*&type=cms.coursepage:
    get:
      operationId: pages_?fields=*&type=cms.coursepage_retrieve
      description: Returns pages of type cms.CoursePage
      summary: List all Course Pages
      parameters:
      - in: query
        name: readable_id
        schema:
          type: string
        description: filter by course readable_id
      tags:
      - pages
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePageList'
          description: ''
  /api/v2/pages/?fields=*&type=cms.programpage:
    get:
      operationId: pages_?fields=*&type=cms.programpage_retrieve
      description: Returns pages of type cms.ProgramPage
      summary: List all Program Pages
      parameters:
      - in: query
        name: readable_id
        schema:
          type: string
        description: filter by program readable_id
      tags:
      - pages
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramPageList'
          description: ''
  /api/v2/pages/find/:
    get:
      operationId: pages_find_retrieve
      description: |-
        Custom API viewset for Wagtail pages with
        additional filtering and metadata fields.
      tags:
      - pages
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: ''
  /api/v2/program-collections/:
    get:
      operationId: program_collections_list
      description: Readonly viewset for ProgramCollection objects.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - program-collections
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedV2ProgramCollectionList'
          description: ''
  /api/v2/program-collections/{id}/:
    get:
      operationId: program_collections_retrieve
      description: Readonly viewset for ProgramCollection objects.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Program Collection.
        required: true
      tags:
      - program-collections
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProgramCollection'
          description: ''
  /api/v2/program_certificates/{uuid}/:
    get:
      operationId: program_certificates_retrieve
      description: Viewset to read a single course certificate
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - program_certificates
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProgramCertificate'
          description: ''
  /api/v2/program_enrollments/:
    get:
      operationId: v2_program_enrollments_list
      description: |-
        Returns a unified set of program and course enrollments for the current
        user using v2 serializers.
      tags:
      - program_enrollments
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/V2UserProgramEnrollmentDetail'
          description: ''
  /api/v2/program_enrollments/{id}/:
    get:
      operationId: v2_program_enrollments_retrieve
      description: Retrieve a specific program enrollment using v2 serializers.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Program ID
        required: true
      tags:
      - program_enrollments
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2UserProgramEnrollmentDetail'
          description: ''
    delete:
      operationId: v2_program_enrollments_destroy
      description: |-
        Unenroll the user from this program. This is simpler than the corresponding
        function for CourseRunEnrollments; edX doesn't really know what programs
        are so there's nothing to process there.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Program ID
        required: true
      tags:
      - program_enrollments
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/V2UserProgramEnrollmentDetail'
          description: ''
  /api/v2/programs/:
    get:
      operationId: programs_list_v2
      description: List Programs - v2
      parameters:
      - in: query
        name: contract_id
        schema:
          type: number
      - in: query
        name: id
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: live
        schema:
          type: boolean
      - in: query
        name: org_id
        schema:
          type: number
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: page__live
        schema:
          type: boolean
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: readable_id
        schema:
          type: string
      tags:
      - programs
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedV2ProgramDetailList'
          description: ''
  /api/v2/programs/{id}/:
    get:
      operationId: programs_retrieve_v2
      description: API view set for Programs - v2
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique integer value (pk) or readable_id string identifying
          this program.
        required: true
      tags:
      - programs
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProgramDetail'
          description: ''
  /api/v2/verifiable_course_credential/{credential_id}/download/:
    get:
      operationId: verifiable_course_credential_download_list
      description: Returns the json for the verifiable credential with the given ID
      parameters:
      - in: path
        name: credential_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - verifiable_course_credential
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v2/verifiable_program_credential/{credential_id}/download/:
    get:
      operationId: verifiable_program_credential_download_list
      description: Returns the json for the verifiable credential with the given ID
      parameters:
      - in: path
        name: credential_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - verifiable_program_credential
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v2/verified_program_enrollments/{courserun_id}/:
    post:
      operationId: verified_program_enrollments_create
      description: |-
        Create a program-related course enrollment for the learner.

        Some special handling is needed for program-related course run enrollments
        when the learner has an enrollment in the program. The learner should get a
        course run enrollment that matches their program enrollment at no additional
        charge.
      parameters:
      - in: path
        name: courserun_id
        schema:
          type: string
        required: true
      tags:
      - verified_program_enrollments
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                type: string
          multipart/form-data:
            schema:
              type: array
              items:
                type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRunEnrollmentRequestV2'
          description: ''
        '204':
          description: No response body
        '400':
          description: No response body
        '404':
          description: No response body
components:
  schemas:
    AvailabilityEnum:
      enum:
      - anytime
      - dated
      type: string
      description: |-
        * `anytime` - anytime
        * `dated` - dated
      x-enum-descriptions:
      - anytime
      - dated
    BaseProduct:
      type: object
      description: Simple serializer for Product without related purchasable objects
      properties:
        id:
          type: integer
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        description:
          type: string
        is_active:
          type: boolean
          description: Controls visibility of the product in the app.
      required:
      - description
      - id
      - price
    BaseProgram:
      type: object
      description: Basic program model serializer
      properties:
        title:
          type: string
          readOnly: true
        readable_id:
          type: string
          readOnly: true
        id:
          type: integer
          readOnly: true
        type:
          type: string
          readOnly: true
        display_mode:
          readOnly: true
          nullable: true
          description: |-
            Set to 'course' to treat this program as a course in APIs.

            * `course` - course
          oneOf:
          - $ref: '#/components/schemas/DisplayModeEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - display_mode
      - id
      - readable_id
      - title
      - type
    BlankEnum:
      enum:
      - ''
    CertificatePage:
      type: object
      description: Serializer for certificate pages, including overrides and signatory
        items.
      properties:
        id:
          type: integer
        meta:
          $ref: '#/components/schemas/PageMeta'
        title:
          type: string
        product_name:
          type: string
        CEUs:
          type: string
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/Override'
        signatory_items:
          type: array
          items:
            $ref: '#/components/schemas/SignatoryItem'
      required:
      - CEUs
      - id
      - meta
      - overrides
      - product_name
      - signatory_items
      - title
    CertificatePageList:
      type: object
      description: Serializer for a list of certificate pages.
      properties:
        meta:
          $ref: '#/components/schemas/PageListMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CertificatePage'
      required:
      - items
      - meta
    CertificatePageModel:
      type: object
      description: Extends the CertificatePageSerializer to work with a model object.
      properties:
        id:
          type: integer
        meta:
          allOf:
          - $ref: '#/components/schemas/PageMetaModel'
          readOnly: true
        title:
          type: string
        product_name:
          type: string
        CEUs:
          type: string
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/Override'
        signatory_items:
          type: array
          items:
            $ref: '#/components/schemas/SignatoryItem'
      required:
      - CEUs
      - id
      - meta
      - overrides
      - product_name
      - signatory_items
      - title
    CoursePage:
      type: object
      description: Course page model serializer
      properties:
        feature_image_src:
          type: string
          nullable: true
          readOnly: true
        page_url:
          type: string
          format: uri
          readOnly: true
        description:
          type: string
          description: Get cleaned description text.
          readOnly: true
        live:
          type: boolean
          readOnly: true
        length:
          type: string
          description: Get cleaned length text.
          readOnly: true
        effort:
          type: string
          nullable: true
          description: Get cleaned effort text.
          readOnly: true
        financial_assistance_form_url:
          type: string
          format: uri
          readOnly: true
        current_price:
          type: integer
          nullable: true
          description: Get the current price of the course product.
          readOnly: true
        instructors:
          type: array
          items: {}
          description: Get instructor information
          readOnly: true
      required:
      - current_price
      - description
      - effort
      - feature_image_src
      - financial_assistance_form_url
      - instructors
      - length
      - live
      - page_url
    CoursePageItem:
      type: object
      description: Serializer for individual course page items, including all relevant
        fields.
      properties:
        id:
          type: integer
          readOnly: true
        meta:
          $ref: '#/components/schemas/PageMeta'
        title:
          type: string
          description: The page title as you'd like it to be seen by the public
          maxLength: 255
        description:
          type: string
          description: The description shown on the home page and product page.
        length:
          type: string
          description: A short description indicating how long it takes to complete
            (e.g. '4 weeks').
          maxLength: 50
        effort:
          type: string
          nullable: true
          description: A short description indicating how much effort is required
            (e.g. 1-3 hours per week).
          maxLength: 100
        min_weekly_hours:
          type: string
          description: The minimum number of hours per week required to complete the
            course.
          maxLength: 5
        max_weekly_hours:
          type: string
          description: The maximum number of hours per week required to complete the
            course.
          maxLength: 5
        min_weeks:
          type: integer
          maximum: 32767
          minimum: -32768
          nullable: true
          description: The minimum number of weeks required to complete the course/program.
        max_weeks:
          type: integer
          maximum: 32767
          minimum: -32768
          nullable: true
          description: The maximum number of weeks required to complete the course/program.
        price:
          type: array
          items:
            $ref: '#/components/schemas/PriceItem'
        min_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Specify the minimum product price. This is used by MIT Learn.
        max_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Specify the maximum product price. This is used by MIT Learn.
        prerequisites:
          type: string
          nullable: true
          description: A short description indicating prerequisites of this course/program.
        faq_url:
          type: string
          format: uri
