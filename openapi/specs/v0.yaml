openapi: 3.0.3
info:
  title: MITx Online API
  version: 0.0.1 (v0)
  description: MIT public API
paths:
  /api/v0/b2b/attach/{enrollment_code}/:
    post:
      operationId: b2b_attach_create
      description: |-
        Use the provided enrollment code to attach the user to a B2B contract.

        This will not create an order, nor will it enroll the user. It will
        attach the user to the contract and log that the code was used for this
        purpose (but will _not_ invalidate the code, since we're not actually
        using it at this point).

        This will respect the activation and expiration dates (of both the contract
        and the discount), and will make sure there's sufficient available seats
        in the contract. It will also make sure the code hasn't been used for
        attachment purposes before.

        If the user is already in the contract, then we skip it.

        Returns:
        - 201: Code successfully redeemed and user attached to new contract(s)
        - 200: Code valid but user already attached to all associated contracts
        - 404: Invalid or expired enrollment code
        - 409: Code valid but no available seats in associated contract(s)
        - list of ContractPageSerializer - the active contract associated with the code
      parameters:
      - in: path
        name: enrollment_code
        schema:
          type: string
        required: true
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContractPage'
          description: ''
  /api/v0/b2b/contracts/:
    get:
      operationId: b2b_contracts_list
      description: Viewset for the ContractPage model.
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContractPage'
          description: ''
  /api/v0/b2b/contracts/{contract_slug}/:
    get:
      operationId: b2b_contracts_retrieve
      description: Viewset for the ContractPage model.
      parameters:
      - in: path
        name: contract_slug
        schema:
          type: string
          description: The name of the page as it will appear in URLs e.g http://domain.com/blog/[my-slug]/
        required: true
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPage'
          description: ''
  /api/v0/b2b/contracts/{contract_slug}/all_variant_runs/:
    get:
      operationId: b2b_contracts_all_variant_runs_list
      description: Return the variant runs for a contract.
      parameters:
      - in: path
        name: contract_slug
        schema:
          type: string
          description: The name of the page as it will appear in URLs e.g http://domain.com/blog/[my-slug]/
        required: true
      - in: query
        name: course_id
        schema:
          type: array
          items:
            type: integer
        description: Course ID(s) to use
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BaseCourseRun'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPageVariantRunBadRequest'
          description: ''
  /api/v0/b2b/enroll/{readable_id}/:
    post:
      operationId: b2b_enroll_create
      description: Create an enrollment for the given course run.
      parameters:
      - in: path
        name: readable_id
        schema:
          type: string
        required: true
      tags:
      - b2b
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B2BEnrollRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/B2BEnrollRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/B2BEnrollRequestRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateB2BEnrollment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateB2BEnrollment'
          description: ''
  /api/v0/b2b/manager/organizations/:
    get:
      operationId: b2b_manager_organizations_list
      description: List managed organizations
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: sso_organization_id
        schema:
          type: string
          format: uuid
        description: Narrow the result to the single org with this Keycloak organization
          UUID (sso_organization_id). A non-empty response means the caller manages
          that org.
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationPageList'
          description: ''
  /api/v0/b2b/manager/organizations/{parent_lookup_organization}/contracts/:
    get:
      operationId: b2b_manager_organizations_contracts_list
      description: List an organization's contracts.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the contract
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: parent_lookup_organization
        schema:
          type: integer
        description: ID of the parent organization
        required: true
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBaseContractPageList'
          description: ''
  /api/v0/b2b/manager/organizations/{parent_lookup_organization}/contracts/{id}/:
    get:
      operationId: b2b_manager_organizations_contracts_retrieve
      description: List an organization's contracts.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the contract
        required: true
      - in: path
        name: parent_lookup_organization
        schema:
          type: integer
        description: ID of the parent organization
        required: true
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerContractDetail'
          description: ''
  /api/v0/b2b/manager/organizations/{parent_lookup_organization}/contracts/{id}/codes/:
    get:
      operationId: b2b_manager_organizations_contracts_codes_list
      description: List enrollment codes for a contract. Only shows codes for contracts
        that require them (non-auto membership types). Logic varies based on whether
        contract has learner limits.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the contract
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: parent_lookup_organization
        schema:
          type: integer
        description: ID of the parent organization
        required: true
      - in: query
        name: search_term
        schema:
          type: string
        description: Filter codes by assigned email, user email, user name, or assigned
          name.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - assigned
          - redeemed
        description: Filter codes by status. Supported values are assigned and redeemed.
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedManagerEnrollmentCodeList'
          description: ''
  /api/v0/b2b/manager/organizations/{parent_lookup_organization}/contracts/{id}/codes/{code}/assign/:
    post:
      operationId: b2b_manager_organizations_contracts_codes_assign_create
      description: Assign an available enrollment code to an email address and send
        an invite email.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        description: The discount code to assign.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the contract
        required: true
      - in: path
        name: parent_lookup_organization
        schema:
          type: integer
        description: ID of the parent organization
        required: true
      tags:
      - b2b
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRevokeCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignRevokeCodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignRevokeCodeRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerEnrollmentCode'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
  /api/v0/b2b/manager/organizations/{parent_lookup_organization}/contracts/{id}/codes/{code}/reassign/:
    put:
      operationId: b2b_manager_organizations_contracts_codes_reassign_update
      description: Reassign the assignment for a specific enrollment code
      parameters:
      - in: path
        name: code
        schema:
          type: string
        description: The discount code to reassign.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the contract
        required: true
      - in: path
        name: parent_lookup_organization
        schema:
          type: integer
        description: ID of the parent organization
        required: true
      tags:
      - b2b
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRevokeCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignRevokeCodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignRevokeCodeRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerEnrollmentCode'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
  /api/v0/b2b/manager/organizations/{parent_lookup_organization}/contracts/{id}/codes/{code}/remind/:
    post:
      operationId: b2b_manager_organizations_contracts_codes_remind_create
      description: Send a reminder email to the user assigned to a specific enrollment
        code who has not yet claimed it.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        description: The discount code to send a reminder for.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the contract
        required: true
      - in: path
        name: parent_lookup_organization
        schema:
          type: integer
        description: ID of the parent organization
        required: true
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerEnrollmentCode'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
  /api/v0/b2b/manager/organizations/{parent_lookup_organization}/contracts/{id}/codes/{code}/revoke/:
    delete:
      operationId: b2b_manager_organizations_contracts_codes_revoke_destroy
      description: Revoke the assignment for a specific enrollment code, returning
        it to the unassigned pool.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        description: The discount code to revoke.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the contract
        required: true
      - in: path
        name: parent_lookup_organization
        schema:
          type: integer
        description: ID of the parent organization
        required: true
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerEnrollmentCode'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
  /api/v0/b2b/manager/organizations/{parent_lookup_organization}/contracts/{id}/codes/bulk_assign/:
    post:
      operationId: b2b_manager_organizations_contracts_codes_bulk_assign_create
      description: Bulk-assign enrollment codes from a list of (email, name) records.
        One available code is assigned per record and an invite email is sent to each
        successfully assigned address. Returns lists of assigned codes and any errors.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the contract
        required: true
      - in: path
        name: parent_lookup_organization
        schema:
          type: integer
        description: ID of the parent organization
        required: true
      tags:
      - b2b
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AssignRevokeCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AssignRevokeCodeRequestRequest'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AssignRevokeCodeRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAssignResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
  /api/v0/b2b/manager/organizations/{parent_lookup_organization}/contracts/{id}/codes/send_test_email/:
    post:
      operationId: b2b_manager_organizations_contracts_codes_send_test_email_create
      description: Send test assignment email to specified email address. This does
        not include an enrollment code.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the contract
        required: true
      - in: path
        name: parent_lookup_organization
        schema:
          type: integer
        description: ID of the parent organization
        required: true
      tags:
      - b2b
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTestEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendTestEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendTestEmailRequest'
        required: true
      responses:
        '200':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
  /api/v0/b2b/manager/organizations/{parent_lookup_organization}/contracts/{id}/course_runs/:
    get:
      operationId: b2b_manager_organizations_contracts_course_runs_list
      description: List course runs available for a specific contract.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the contract
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: parent_lookup_organization
        schema:
          type: integer
        description: ID of the parent organization
        required: true
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedManagerCourseRunList'
          description: ''
  /api/v0/b2b/manager/organizations/{parent_lookup_organization}/contracts/{id}/course_runs/{course_run_id}/enrollments/:
    get:
      operationId: b2b_manager_organizations_contracts_course_runs_enrollments_list
      description: List enrollments for a specific course run within a contract.
      parameters:
      - in: path
        name: course_run_id
        schema:
          type: string
        description: Courseware ID to pull enrollments for.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the contract
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: parent_lookup_organization
        schema:
          type: integer
        description: ID of the parent organization
        required: true
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedManagerEnrollmentList'
          description: ''
  /api/v0/b2b/manager/organizations/{id}/:
    get:
      operationId: b2b_manager_organizations_detail
      description: Retrieve managed organizations
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the organization
        required: true
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
          description: ''
  /api/v0/b2b/organizations/:
    get:
      operationId: b2b_organizations_list
      description: Viewset for the OrganizationPage model.
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationPage'
          description: ''
  /api/v0/b2b/organizations/{organization_slug}/:
    get:
      operationId: b2b_organizations_retrieve
      description: Viewset for the OrganizationPage model.
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
          description: The name of the page as it will appear in URLs e.g http://domain.com/blog/[my-slug]/
        required: true
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
          description: ''
  /api/v0/b2b/service/organization-manager-check/:
    get:
      operationId: b2b_service_organization_manager_check
      description: Check whether a user is a manager of an organization. Service-to-service
        only; requires the `b2b:manager-check` scope.
      parameters:
      - in: query
        name: sso_organization_id
        schema:
          type: string
          format: uuid
        description: The organization's Keycloak UUID (OrganizationPage.sso_organization_id).
        required: true
      - in: query
        name: user_global_id
        schema:
          type: string
        description: The user's Keycloak subject (User.global_id).
        required: true
      tags:
      - b2b
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationManagerCheck'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetailError'
          description: ''
  /api/v0/baskets/:
    get:
      operationId: baskets_list
      description: Retrives the current user's baskets.
      tags:
      - baskets
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BasketWithProduct'
          description: ''
  /api/v0/baskets/{parent_lookup_basket}/items/:
    get:
      operationId: baskets_items_list
      description: Returns the basket items for the current user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the basket item
        required: true
      - in: path
        name: parent_lookup_basket
        schema:
          type: integer
        description: ID of the parent basket
        required: true
      tags:
      - baskets
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BasketItem'
          description: ''
    post:
      operationId: baskets_items_create
      description: Returns the basket items for the current user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the basket item
        required: true
      - in: path
        name: parent_lookup_basket
        schema:
          type: integer
        description: ID of the parent basket
        required: true
      tags:
      - baskets
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketItem'
          description: ''
  /api/v0/baskets/{parent_lookup_basket}/items/{id}/:
    get:
      operationId: baskets_items_retrieve
      description: Returns the basket items for the current user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the basket item
        required: true
      - in: path
        name: parent_lookup_basket
        schema:
          type: integer
        description: ID of the parent basket
        required: true
      tags:
      - baskets
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketItem'
          description: ''
    put:
      operationId: baskets_items_update
      description: Returns the basket items for the current user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the basket item
        required: true
      - in: path
        name: parent_lookup_basket
        schema:
          type: integer
        description: ID of the parent basket
        required: true
      tags:
      - baskets
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketItem'
          description: ''
    patch:
      operationId: baskets_items_partial_update
      description: Returns the basket items for the current user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the basket item
        required: true
      - in: path
        name: parent_lookup_basket
        schema:
          type: integer
        description: ID of the parent basket
        required: true
      tags:
      - baskets
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketItem'
          description: ''
    delete:
      operationId: baskets_items_destroy
      description: Returns the basket items for the current user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the basket item
        required: true
      - in: path
        name: parent_lookup_basket
        schema:
          type: integer
        description: ID of the parent basket
        required: true
      tags:
      - baskets
      responses:
        '204':
          description: No response body
  /api/v0/baskets/{id}/:
    get:
      operationId: baskets_retrieve
      description: Retrieve a basket for the current user.
      parameters:
      - in: path
