compressionLevel: mixed

enableGlobalCache: false

enableScripts: false

nodeLinker: node-modules

# Skip npm versions published in the last 7 days, matching Renovate's minimumReleaseAge
npmMinimalAgeGate: 7d

# Worker-thread zip conversion holds one libzip WASM heap per CPU, which can exceed the
# 3GB Mend Renovate runner (mitodl/learn-ai#40). Off-heap memory, so NODE_OPTIONS can't cap it.
taskPoolMode: async

yarnPath: .yarn/releases/yarn-4.18.1.cjs
