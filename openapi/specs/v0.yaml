          maxLength: 255
      required:
      - email
    B2BEnrollRequestRequest:
      type: object
      description: |-
        Serializer for the B2B enrollment request body.

        Accepts an optional program_id so the user can be enrolled in the
        appropriate program alongside the course run enrollment.
      properties:
        program_id:
          type: string
          description: The readable_id of the program to enroll the user in.
    BaseContractPage:
      type: object
      description: Simplified serializer for the ContractPage model.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          description: The name of the contract.
        description:
          type: string
          readOnly: true
          description: Any useful extra information about the contract.
        membership_type:
          type: string
        organization:
          type: integer
          readOnly: true
          description: The organization that owns this contract.
        contract_start:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: The start date of the contract.
        contract_end:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: The end date of the contract.
        slug:
          type: string
          readOnly: true
          description: The name of the page as it will appear in URLs e.g http://domain.com/blog/[my-slug]/
          pattern: ^[-\w]+$
      required:
      - contract_end
      - contract_start
      - description
      - id
      - membership_type
      - name
      - organization
      - slug
    BaseCourse:
      type: object
      description: Basic course model serializer
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        readable_id:
          type: string
          pattern: ^[\w\-+:\.]+$
          maxLength: 255
        type:
          type: string
          description: Returns the type of object this is serializing.
          readOnly: true
      required:
      - id
      - readable_id
      - title
      - type
    BaseCourseRun:
      type: object
      description: Minimal CourseRun model serializer
      properties:
        title:
          type: string
          description: The title of the course. This value is synced automatically
            with edX studio.
          maxLength: 255
        start_date:
          type: string
          format: date-time
          nullable: true
          description: The day the course begins. This value is synced automatically
            with edX studio.
        end_date:
          type: string
          format: date-time
          nullable: true
          description: The last day the course is active. This value is synced automatically
            with edX studio.
        enrollment_start:
          type: string
          format: date-time
          nullable: true
          description: The first day students can enroll. This value is synced automatically
            with edX studio.
        enrollment_end:
          type: string
          format: date-time
          nullable: true
          description: The last day students can enroll. This value is synced automatically
            with edX studio.
        expiration_date:
          type: string
          format: date-time
          nullable: true
          description: The date beyond which the learner should not see link to this
            course run on their dashboard.
