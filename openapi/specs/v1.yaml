openapi: 3.0.3
info:
  title: MITx Online API
  version: 0.0.1 (v1)
  description: MIT public API
paths:
  /api/v1/course_runs/:
    get:
      operationId: course_runs_list
      description: API view set for CourseRuns
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: live
        schema:
          type: boolean
      tags:
      - course_runs
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/V1CourseRunWithCourse'
          description: ''
  /api/v1/course_runs/{id}/:
    get:
      operationId: course_runs_retrieve
      description: API view set for CourseRuns
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course run.
        required: true
      tags:
      - course_runs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1CourseRunWithCourse'
          description: ''
  /api/v1/courses/:
    get:
      operationId: api_v1_courses_list
      description: List all courses - API v1
      parameters:
      - in: query
        name: courserun_is_enrollable
        schema:
          type: boolean
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: live
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: page__live
        schema:
          type: boolean
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: readable_id
        schema:
          type: string
      tags:
      - courses
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedV1CourseWithCourseRunsList'
          description: ''
  /api/v1/courses/{id}/:
    get:
      operationId: api_v1_courses_retrieve
      description: Retrieve a specific course - API v1
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1CourseWithCourseRuns'
          description: ''
  /api/v1/departments/:
    get:
      operationId: departments_list_v1
      description: List departments - v1
      tags:
      - departments
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentWithCount'
          description: ''
  /api/v1/departments/{id}/:
    get:
      operationId: departments_retrieve_v1
      description: Get department details - v1
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this department.
        required: true
      tags:
      - departments
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentWithCount'
          description: ''
  /api/v1/enrollments/:
    get:
      operationId: enrollments_list
      description: API view set for user enrollments
      tags:
      - enrollments
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseRunEnrollment'
          description: ''
    post:
      operationId: enrollments_create
      description: API view set for user enrollments
      tags:
      - enrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRunEnrollmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseRunEnrollmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseRunEnrollmentRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRunEnrollment'
          description: ''
  /api/v1/enrollments/{id}/:
    put:
      operationId: enrollments_update
      description: API view set for user enrollments
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course run enrollment.
        required: true
      tags:
      - enrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRunEnrollmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseRunEnrollmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseRunEnrollmentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRunEnrollment'
          description: ''
    patch:
      operationId: enrollments_partial_update
      description: Update enrollment email preferences
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course run enrollment.
        required: true
      tags:
      - enrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCourseRunEnrollmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCourseRunEnrollmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCourseRunEnrollmentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRunEnrollment'
          description: ''
    delete:
      operationId: enrollments_destroy
      description: API view set for user enrollments
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course run enrollment.
        required: true
      tags:
      - enrollments
      responses:
        '204':
          description: No response body
  /api/v1/program_enrollments/:
    get:
      operationId: program_enrollments_list
      description: |-
        Returns a unified set of program and course enrollments for the current
        user.
      tags:
      - program_enrollments
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProgramEnrollmentDetail'
          description: ''
  /api/v1/program_enrollments/{id}/:
    get:
      operationId: program_enrollments_retrieve
      description: Retrieve a specific program enrollment.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Program enrollment ID
        required: true
      tags:
      - program_enrollments
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProgramEnrollmentDetail'
          description: ''
    delete:
      operationId: program_enrollments_destroy
      description: |-
        Unenroll the user from this program. This is simpler than the corresponding
        function for CourseRunEnrollments; edX doesn't really know what programs
        are so there's nothing to process there.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Program enrollment ID
        required: true
      tags:
      - program_enrollments
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProgramEnrollmentDetail'
          description: ''
  /api/v1/programs/:
    get:
      operationId: programs_list_v1
      description: List Programs - v1
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: live
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: readable_id
        schema:
          type: string
      tags:
      - programs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedV1ProgramList'
          description: ''
  /api/v1/programs/{id}/:
    get:
      operationId: programs_retrieve_v1
      description: API view set for Programs - v1
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this program.
        required: true
      tags:
      - programs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Program'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Course:
      type: object
      description: Course model serializer
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        readable_id:
          type: string
          pattern: ^[\w\-+:\.]+$
          maxLength: 255
        next_run_id:
          type: integer
          nullable: true
          description: Get next run id
          readOnly: true
        departments:
          type: array
          items:
            $ref: '#/components/schemas/Department'
          readOnly: true
        page:
          allOf:
          - $ref: '#/components/schemas/CoursePage'
          readOnly: true
        programs:
          allOf:
          - $ref: '#/components/schemas/Program'
          nullable: true
          readOnly: true
      required:
      - departments
      - id
      - next_run_id
      - page
      - programs
      - readable_id
      - title
    CoursePage:
      type: object
      description: Course page model serializer
      properties:
        feature_image_src:
          type: string
          nullable: true
          readOnly: true
        page_url:
          type: string
          format: uri
          readOnly: true
        description:
          type: string
          description: Get cleaned description text.
          readOnly: true
        live:
          type: boolean
          readOnly: true
        length:
          type: string
          description: Get cleaned length text.
          readOnly: true
        effort:
          type: string
          nullable: true
          description: Get cleaned effort text.
          readOnly: true
        financial_assistance_form_url:
          type: string
          format: uri
          readOnly: true
        current_price:
          type: integer
          nullable: true
          description: Get the current price of the course product.
          readOnly: true
        instructors:
          type: array
          items: {}
          description: Get instructor information
          readOnly: true
      required:
      - current_price
      - description
      - effort
      - feature_image_src
      - financial_assistance_form_url
      - instructors
      - length
      - live
      - page_url
    CourseRequest:
      type: object
      description: Course model serializer
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        readable_id:
          type: string
          minLength: 1
          pattern: ^[\w\-+:\.]+$
          maxLength: 255
      required:
      - readable_id
      - title
    CourseRunCertificate:
      type: object
      description: CourseRunCertificate model serializer
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        link:
          type: string
          description: |-
            Get the link at which this certificate will be served
            Format: /certificate/<uuid>/
            Example: /certificate/93ebd74e-5f88-4b47-bb09-30a6d575328f/
          readOnly: true
      required:
      - link
      - uuid
    CourseRunEnrollment:
      type: object
      description: CourseRunEnrollment model serializer
      properties:
        id:
          type: integer
          readOnly: true
        edx_emails_subscription:
          type: boolean
        certificate:
          allOf:
          - $ref: '#/components/schemas/CourseRunCertificate'
          readOnly: true
          nullable: true
        enrollment_mode:
          allOf:
          - $ref: '#/components/schemas/EnrollmentModeEnum'
          readOnly: true
        grades:
          type: array
          items:
            $ref: '#/components/schemas/CourseRunGrade'
          readOnly: true
        approved_flexible_price_exists:
          type: boolean
          readOnly: true
        run:
          allOf:
          - $ref: '#/components/schemas/V1CourseRunWithCourse'
          readOnly: true
      required:
      - approved_flexible_price_exists
      - certificate
      - enrollment_mode
      - grades
      - id
      - run
    CourseRunEnrollmentRequest:
      type: object
      description: CourseRunEnrollment model serializer
      properties:
        edx_emails_subscription:
          type: boolean
        run_id:
          type: integer
          writeOnly: true
      required:
      - run_id
    CourseRunGrade:
      type: object
      description: CourseRunGrade serializer
      properties:
        grade:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
          readOnly: true
        letter_grade:
          type: string
          readOnly: true
          nullable: true
          maxLength: 10
        passed:
          type: boolean
          readOnly: true
        set_by_admin:
          type: boolean
          readOnly: true
        grade_percent:
          type: number
          format: double
          description: Returns the grade field value as a number out of 100 (or Decimal(0)
            if the value is None)
          readOnly: true
      required:
      - grade
      - grade_percent
      - letter_grade
      - passed
      - set_by_admin
