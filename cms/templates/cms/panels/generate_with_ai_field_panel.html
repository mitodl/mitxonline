{% include "wagtailadmin/panels/field_panel.html" %}
{% if metadata_url %}
  <div data-credential-metadata hidden style="margin-bottom: 2rem">
    <button type="button" class="button button-small button-secondary" data-credential-metadata-url="{{ metadata_url }}" data-credential-metadata-field="{{ metadata_field }}" data-credential-metadata-target="{{ field.id_for_label }}">Generate with AI</button>
    <p class="help" data-credential-metadata-note hidden>This is generated by AI</p>
    <p class="help" data-credential-metadata-message role="status" hidden></p>
  </div>
{% endif %}
